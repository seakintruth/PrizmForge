name: restore-developer-edit-pr83
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backlog-proccessing-correction
          fetch-depth: 0
      - name: Run restore script
        run: python3 workflow/do_restore_developer_edit.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow/developer_edit.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(pr83): restore full developer_edit.py + resilient reviewer parse"
            git push origin HEAD:backlog-proccessing-correction
          fi
