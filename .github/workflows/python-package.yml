name: Python Package CI

on:
  push:
    branches: [ "main", "develop", "feature/**", "fix/**", "ci/**" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore

jobs:
  # Runs alongside lint/test (does not block them). Commits use [skip ci].
  auto-fix-and-push:
    name: Auto-Fix & Push Formatting Changes
    runs-on: ubuntu-latest
    # Fork PRs cannot push back to the head branch
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install formatters
        run: pip install ruff black isort

      - name: Apply Formatters & Auto-Fixes
        run: |
          ruff check . --fix --unsafe-fixes || true
          black . || true
          isort . || true
          ruff format . || true

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: automated formatting and ruff fixes [skip ci]"
          commit_user_name: "PrizmForge Bot"
          commit_user_email: "bot@prizmforge.internal"

  # Independent of auto-fix and test — parallel gate
  code-quality:
    name: Code Quality (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check & format --check
        run: |
          ruff check .
          ruff format --check .

  # Independent of lint — parallel gate
  test-normal:
    name: Normal Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Provide config.json for tests
        run: |
          if [ ! -f config.json ]; then
            cp example_config.json config.json
          fi

      - name: Run normal tests (batched, exclude @slow)
        run: |
          chmod +x utils/run_tests.sh
          # --batched keeps @pytest.mark.serial at -j 1; parallel batches use -j 4
          ./utils/run_tests.sh --normal --batched -j 4 --timeout 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-normal-reports
          path: .PrizmForge/reports/
          if-no-files-found: ignore
          retention-days: 14
