name: Python Package CI

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 1. Mandatory permission to push commits back to the repo
permissions:
  contents: write

jobs:
  auto-fix-and-push:
    name: Auto-Fix & Push Formatting Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Target active PR branch or current branch head
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Apply Formatters & Auto-Fixes
        run: |
          ruff check . --fix --unsafe-fixes || true
          black . || true
          isort . || true
          ruff format . || true

      # 2. Commit and push back to branch if formatting diffs exist
      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: automated formatting and ruff fixes [skip ci]"
          commit_user_name: "PrizmForge Bot"
          commit_user_email: "bot@prizmforge.internal"

  code-quality:
    name: Code Quality & Security Audit
    needs: auto-fix-and-push # Runs after auto-fix job completes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Verify Clean Linter Pass
        run: |
          ruff check .
          ruff format --check .
