name: Python Package CI

on:
  push:
    branches: [ "main", "develop", "feature/**", "fix/**", "ci/**" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auto-fix-and-push:
    name: Auto-Fix & Push Formatting Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Apply Formatters & Auto-Fixes
        run: |
          ruff check . --fix --unsafe-fixes || true
          black . || true
          isort . || true
          ruff format . || true

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: automated formatting and ruff fixes [skip ci]"
          commit_user_name: "PrizmForge Bot"
          commit_user_email: "bot@prizmforge.internal"

  code-quality:
    name: Code Quality & Security Audit
    needs: auto-fix-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Verify Clean Linter Pass
        run: |
          ruff check .
          ruff format --check .

  test-normal:
    name: Normal Test Suite
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Provide config.json for tests
        run: |
          if [ ! -f config.json ]; then
            cp example_config.json config.json
          fi

      - name: Run normal tests (exclude @slow)
        run: |
          chmod +x utils/run_tests.sh
          # GHA runners are ~7GB RAM; 4 workers is a safe default
          ./utils/run_tests.sh --normal -j 4 --timeout 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-normal-reports
          path: .PrizmForge/reports/
          if-no-files-found: ignore
          retention-days: 14
