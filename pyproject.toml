[tool.black]
line-length = 159

[tool.isort]
profile = "black"
line_length = 159
skip = ["build", "dist", ".venv", ".git", ".PrizmFoundry"]

[tool.ruff]
# General ruff options (non-lint/format keys)
exclude = ["build/", "dist/", ".venv/", ".git/", ".PrizmFoundry/"]
line-length = 159

[tool.ruff.lint]
# Linting rules (preferred location for select/ignore)
select = ["E", "F", "W", "C90", "I"]
# extend-ignore = ["E203"]  # example, add exceptions here as needed

[tool.ruff.lint.mccabe]
# 🎯 Set maximum function complexity threshold to 15 (default is 10)
max-complexity = 15
