[mypy]
# Match the runtime in CI; keep type-checking useful but tolerant of missing third-party stubs.
python_version = 3.14
ignore_missing_imports = True
show_error_codes = True
warn_unused_ignores = True
warn_redundant_casts = True
# Disable strictness that will create noise immediately — opt in later as codebase improves:
disallow_untyped_defs = False
no_implicit_optional = False
