[pytest]
markers =
    slow: long-running tests excluded from --normal (deselect with '-m "not slow"')
    serial: must run with a single worker (-j 1); orthogonal to slow
testpaths = tests

# Requires pytest-timeout (see requirements-dev.txt). utils/run_tests.sh also
# passes --timeout; this is a safety net for direct pytest invocations.
timeout = 30
timeout_method = thread

# Prefer utils/run_tests.sh --quick for the curated fast gate.
# For full suite on ~16GB hosts use: utils/run_tests.sh --full --batched -j 2
#
# Marker axes (do not conflate):
#   slow   → duration / gate membership
#   serial → isolation / worker count
# A test may be any combination of the two.
