# PrizmForge GitLab CI (web.git.mil)
# Mirrors GitHub Actions lint + normal test gate.
# Heavy/full suites stay local until worker teardown is reliable under timeout.
#
# Speed notes (K8s executor, ephemeral pods):
# - Lint installs only ruff (not requirements-dev).
# - No `pip install --upgrade pip` (saves ~30s).
# - Shared cache URL / Nexus mirror / prebuilt image are platform concerns;
#   this file does not depend on them.

# Prevent duplicate pipelines when a Merge Request is active
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
      - api_failure

stages:
  - lint
  - test

variables:
  PYTEST_ADDOPTS: ""
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore

# Hidden templates (GitLab `extends`). Runner tag is a routing label, not a secret.
.python_base:
  image: python:3.12-bookworm
  tags:
    - USG-DOD-Global-Custom-Docker-Containers-BuildRunner1

.rules_default:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|feature\/.*|fix\/.*|ci\/.*)$/'

lint:ruff:
  extends:
    - .python_base
    - .rules_default
  stage: lint
  script:
    # Lint gate only needs ruff — do not install pytest/black/mypy/pylint/etc.
    - pip install ruff
    - ruff check .
    - ruff format --check .

test:normal:
  extends:
    - .python_base
    - .rules_default
  stage: test
  needs: ["lint:ruff"]
  timeout: 20 minutes
  # Optional local pip download cache. On ephemeral K8s pods without a
  # runner-level shared cache URL this usually misses; harmless when it does.
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt
    paths:
      - .cache/pip
    policy: pull-push
  before_script:
    - pip install -r requirements-dev.txt
    - |
      if [ ! -f config.json ]; then
        cp example_config.json config.json
      fi
  script:
    - chmod +x utils/run_tests.sh
    # --batched keeps @pytest.mark.serial at -j 1; parallel batches use -j 2
    - ./utils/run_tests.sh --normal --batched -j 2 --timeout 30
  artifacts:
    when: always
    paths:
      - .PrizmForge/reports/
    expire_in: 14 days
